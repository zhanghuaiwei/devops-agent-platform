# AI 生成:Docker Compose 编排 —— 基础设施即代码
# 阶段一(W1)只需 postgres/redis/minio;server/agent-engine/web 在对应端就绪后取消注释
# 教程见 docs/devops-guide/01-Docker与Compose.md
name: devops-agent-platform

services:
  # ---------- PostgreSQL 16(业务数据) ----------
  postgres:
    image: postgres:16-alpine          # alpine 镜像小 ~80MB;版本红线 PG16
    environment:
      POSTGRES_USER: ${DB_USER:-devops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devops123}   # 仅本地默认值
      POSTGRES_DB: ${DB_NAME:-devops_agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # 首次启动自动建表(F1.x 表结构)
    healthcheck:                       # 健康检查:server 依赖它就绪后再启动
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Redis 7.2(refreshToken + 限流计数) ----------
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes   # AOF 持久化:重启不丢黑名单/限流数据
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- MinIO(日志文件对象存储,S3 兼容) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}   # 仅本地默认值
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # 管理控制台
    volumes:
      - miniodata:/data

