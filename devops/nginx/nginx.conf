# AI 生成:Nginx 反向代理配置 —— 生产入口(W5 部署用)
# 教程见 docs/devops-guide/02-Nginx反向代理.md
# 拓扑:浏览器 → Nginx(80) → web(3000) / server(8080,含 WS)

upstream web_frontend {
    server web:3000;                 # compose 服务名解析(同网络内)
}

upstream java_backend {
    server server:8080;
}

server {
    listen 80;
    server_name _;

    # 安全响应头(安全红线:基础防护,防 clickjacking / MIME 嗅探)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- WebSocket 代理(/ws/chat,F1.2)----
    # 关键:Upgrade/Connection 头转发,否则 WS 握手 400;长连接超时放宽(Agent 推理耗时长)
    location /ws/ {
        proxy_pass http://java_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;      # 1 小时无消息也不断线(配合服务端心跳)
        proxy_send_timeout 3600s;
    }

    # ---- Java API 代理 ----
    location /api/ {
        proxy_pass http://java_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;        # 登录限流按真实 IP 计数(F1.1)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;       # SSE 流式响应耗时长
    }

    # ---- 前端静态资源(Next.js)----
    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # Next.js HMR 与可能的 WS 需求
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # gzip:文本资源压缩,减带宽
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1k;
}
